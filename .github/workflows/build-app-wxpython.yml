name: CI - Build wxPython

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: build-wxpython-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build wxPython
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write

    env:
      branch: ${{ github.ref }}
      commiturl: ${{ github.event.head_commit.url }}${{ github.event.release.html_url }}
      commitdate: ${{ github.event.head_commit.timestamp }}${{ github.event.release.published_at }}
      # Absolute path to the universal2 python.org interpreter. Every build step
      # runs it through `arch -x86_64` so the whole toolchain (pip wheels,
      # PyInstaller, the bundled app) is x86_64. OCLP targets Intel Macs, and
      # GitHub no longer offers Intel macOS runners; wxPython ships no universal2
      # wheel, so a native arm64 build cannot run on Intel. An x86_64 app runs
      # on every Intel Mac natively and on Apple Silicon via Rosetta 2.
      PYBIN: /Library/Frameworks/Python.framework/Versions/3.14/bin/python3

    steps:
      - uses: actions/checkout@v4

      - name: Ensure Rosetta 2 (x86_64 emulation on arm64 runner)
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Install Universal Python 3.14
        run: |
          curl -fsSL -o python-installer.pkg https://www.python.org/ftp/python/3.14.0/python-3.14.0-macos11.pkg
          sudo installer -pkg python-installer.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.14/bin" >> $GITHUB_PATH

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-x86_64-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-x86_64-

      - name: Install Dependencies (x86_64)
        run: arch -x86_64 "$PYBIN" -m pip install -r requirements.txt

      - name: Stamp unique build version (X.Y.Z-DDMMYY-HHMM)
        run: |
          STAMP=$(arch -x86_64 "$PYBIN" ci_tooling/stamp_build_version.py)
          echo "Build version: $STAMP"
          echo "build_version=$STAMP" >> "$GITHUB_ENV"

      - name: Recompile Privileged Helper (debug, no team ID check)
        run: arch -x86_64 make -C ci_tooling/privileged_helper_tool debug

      - name: Prepare Assets (--prepare-assets)
        run: >
          arch -x86_64 "$PYBIN" Build-Project.command
          --run-as-individual-steps --reset-dmg-cache
          --prepare-assets

      - name: Prepare Application (--prepare-application)
        run: >
          arch -x86_64 "$PYBIN" Build-Project.command
          --git-branch "${{ env.branch }}"
          --git-commit-url "${{ env.commiturl }}"
          --git-commit-date "${{ env.commitdate }}"
          --reset-pyinstaller-cache
          --run-as-individual-steps
          --prepare-application

      - name: Prepare Package (--prepare-package)
        run: >
          arch -x86_64 "$PYBIN" Build-Project.command
          --run-as-individual-steps
          --prepare-package

      - name: Upload AutoPkg Package to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoPkg-Assets.pkg
          path: ./dist/AutoPkg-Assets.pkg

      - name: Upload Installation Package to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Patcher.pkg
          path: ./dist/OpenCore-Patcher.pkg

      - name: Upload Uninstaller Package to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Patcher-Uninstaller.pkg
          path: ./dist/OpenCore-Patcher-Uninstaller.pkg

      - name: Publish Rolling CI Release (main / manual)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest CI Build
          prerelease: true
          generate_release_notes: false
          files: |
            ./dist/AutoPkg-Assets.pkg
            ./dist/OpenCore-Patcher.pkg
            ./dist/OpenCore-Patcher-Uninstaller.pkg
          body: |
            Automated CI build from `main` — always the newest commit.

            - Build version: `${{ env.build_version }}`
            - Commit: ${{ github.sha }}
            - Built:  ${{ github.event.head_commit.timestamp }}

            The build version (`X.Y.Z-DDMMYY-HHMM`) is unique per build and shows
            in the About box, the log filename, config.plist Build-Version and the
            NVRAM OCLP-Version — use it to confirm exactly which build you tested.

            Experimental T2 (MacBookAir8,1 / 8,2) support:
            - Real T2 keystore exercised (T1 bypass disabled), DEBUG OpenCore +
              file logging so an accessible EFI/OC/opencore-*.txt and NVRAM panic
              log are captured if the SEP times out
            - EFI/BOOT/BOOTx64.efi so the USB entry appears in the T2 Startup Manager

      - name: Create Tagged Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/AutoPkg-Assets.pkg
            ./dist/OpenCore-Patcher.pkg
            ./dist/OpenCore-Patcher-Uninstaller.pkg
          generate_release_notes: false
          body: |
            ## OpenCore Legacy Patcher ${{ github.ref_name }}

            ### Changes
            - Added T2 Mac support for MacBookAir8,1 (MacBook Air 2018) and MacBookAir8,2 (MacBook Air 2019)
            - Fixes USB boot entry not appearing in T2 Mac Startup Manager (adds EFI/BOOT/BOOTx64.efi)
